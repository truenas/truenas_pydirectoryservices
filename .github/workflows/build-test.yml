name: Build and Test

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt update
        apt install -y python3-dev build-essential devscripts debhelper
        apt install -y dh-python pybuild-plugin-pyproject python3-all-dev
        apt install -y python3-setuptools python3-build python3-pytest
        apt install -y python3-mypy libkrb5-dev

    - name: Test Debian package build
      run: |
        dpkg-buildpackage -us -uc -b

    - name: Install and test packages
      run: |
        dpkg -i ../python3-truenas-directoryservices_*.deb
        python3 -m pytest tests/ -v

    - name: Run mypy stub checks
      run: |
        python3 -m mypy stubs/
        python3 -m mypy.stubtest truenas_pynss \
          --allowlist tests/.stubtest_allowlist.txt
        python3 -m mypy.stubtest truenas_pykrb5 \
          --allowlist tests/.stubtest_allowlist_krb5.txt
